<svg xmlns="http://www.w3.org/2000/svg" width="576" height="140" viewBox="0 0 576 140" role="img" aria-label="noema">
  <style>
    .pulse { animation: travel 1.6s linear infinite; }
    @keyframes travel { 0%,100% { fill-opacity: .35; } 10% { fill-opacity: 1; } 25% { fill-opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g shape-rendering="crispEdges">
    <rect class="pulse" style="animation-delay:0.00s" x="20" y="75" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.11s" x="30" y="65" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.22s" x="40" y="55" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.33s" x="50" y="45" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.44s" x="60" y="35" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.55s" x="70" y="35" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.66s" x="80" y="45" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.77s" x="90" y="55" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.88s" x="100" y="65" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:0.99s" x="110" y="75" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:1.10s" x="120" y="85" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:1.21s" x="130" y="95" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:1.32s" x="140" y="105" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:1.43s" x="150" y="105" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:1.54s" x="160" y="95" width="10" height="10" fill="#D946EF"/>
    <rect class="pulse" style="animation-delay:1.65s" x="170" y="85" width="10" height="10" fill="#D946EF"/>
  </g>
  <text x="200" y="106" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#111111">noema</text>
</svg>
